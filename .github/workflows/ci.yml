# Burrito GenDex — CI ("add that CI since it seems important").
#
# Three lanes:
#   · TESTS — every push and pull request: the full jsdom test battery
#     (the same scripts/gendex_*.test.mjs suites the dev box runs), the CSS
#     parse gate, and the JSX syntax gate. Nothing merges red.
#   · BUILD — pushes to main (after tests): electron-forge packages the app
#     end-to-end (main + renderer webpack + the Electron bundle) — the
#     "does it actually build" proof between TESTS and a release.
#   · RELEASE — pushes of a v* tag (after tests): electron-forge builds the
#     installers on Windows and Linux and publishes them to this repo's
#     GitHub Releases. That feed IS the in-app UPDATE CHANNEL (Settings →
#     Data → UPDATES reads releases/latest) — one pushed tag and every
#     installed copy learns a new version exists.
#
# No secrets to configure: GITHUB_TOKEN is provided by Actions itself and
# can publish releases in this repository. The only secret this repo will
# ever need is a code-signing cert, and that stays off GitHub entirely
# (see RELEASE.md).
name: CI

on:
  push:
    # 1.1.6 — the branch list was mangled ("branches: ain]" — a broken
    # bracket that made the whole push trigger a no-op, so the BUILD lane
    # never ran on main).
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (npm ci — the lockfile is the truth)
        run: npm ci
      - name: Test battery (jsdom suites, one at a time — no flaky parallels)
        run: node --test --test-concurrency=1 'scripts/*.test.mjs'
      - name: CSS parse gate
        run: node scripts/css_check.cjs src/index.css
      - name: JSX syntax gate (the touched components)
        run: node scripts/parse_check.mjs src/App.jsx src/components/SettingsModal.jsx src/components/Dialogs.jsx src/components/NewCharacterModal.jsx src/components/Titlebar.jsx src/utils/sqlite_engine.js src/utils/sqlite_wasm.js src/utils/sqlite_glue.js src/utils/nosql_engine.js

  build:
    needs: tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache the Electron binary (the big download)
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-42.9.3-linux
      - name: Install
        run: npm ci
      # 1.8.8 — the name carries a colon (forge: main) and a plain YAML
      # scalar cannot: strict parsers rejected the whole workflow at
      # this line (the final release deserves a CI that parses).
      - name: "Package the app (forge: main + renderer webpack + electron)"
        run: npx electron-forge package

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~\AppData\Local\electron\Cache
          key: electron-42.9.3-${{ matrix.os }}
      - name: Install
        run: npm ci
      - name: Make installers + publish to GitHub Releases (the update channel's feed)
        run: npx electron-forge publish --publisher github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
